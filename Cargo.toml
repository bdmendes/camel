[package]
name = "camel"
version = "2.0.0-alpha"
edition = "2024"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.6.0", features = ["derive"] }
ctor = "0.6.3"
derive_more = { version = "2.1.1", features = ["full"] }
primitive_enum = "1.2.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
smallvec = "1.15.1"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
panic = "abort"
strip = "debuginfo"
